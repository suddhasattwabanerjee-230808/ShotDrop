name: shotdrop
description: "Camera card to Instagram: pick, edit and post photos from a Nikon SD card."
publish_to: 'none'
version: 0.8.1+18

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # Fredoka (SIL Open Font License 1.1, assets/fonts/OFL.txt): the app's rounded, playful typeface.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-400.ttf
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
