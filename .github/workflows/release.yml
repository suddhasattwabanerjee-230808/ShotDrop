name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter test
      # arm64 only: every phone this will be installed on is 64-bit.
      - run: flutter build apk --release --target-platform android-arm64

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME} — see CHANGELOG.md." > release_notes.md
          fi

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "ShotDrop-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'ShotDrop ${{ github.ref_name }}'
          body_path: release_notes.md
          files: ShotDrop-${{ github.ref_name }}.apk
