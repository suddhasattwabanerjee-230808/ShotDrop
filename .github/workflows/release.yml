name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter test

      # The release certificate lives in repo secrets, never in git. Stop here
      # rather than ship a debug-signed APK that can't update the installed one.
      - name: Restore the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHOTDROP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SHOTDROP_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set the SHOTDROP_KEYSTORE_B64 and SHOTDROP_KEYSTORE_PASSWORD repo secrets first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      # arm64 only: every phone this will be installed on is 64-bit.
      - run: flutter build apk --release --target-platform android-arm64
        env:
          SHOTDROP_KEYSTORE_PASSWORD: ${{ secrets.SHOTDROP_KEYSTORE_PASSWORD }}

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for ${GITHUB_REF_NAME} — see CHANGELOG.md." > release_notes.md
          fi

      - name: Rename APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "ShotDrop-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'ShotDrop ${{ github.ref_name }}'
          body_path: release_notes.md
          files: ShotDrop-${{ github.ref_name }}.apk
