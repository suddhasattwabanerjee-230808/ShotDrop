name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The NDK download from Google sometimes arrives cut short ("unknown
      # archive"), failing the build; fetch it first, retrying.
      - name: Install the Android NDK
        run: |
          for i in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" < /dev/null > /dev/null && exit 0
            echo "NDK download failed (try $i), retrying"; sleep 15
          done
          exit 1

      # The Kotlin side (card reading, JPEG writing) is only compiled here, so
      # this build is the check that it still compiles.
      - run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: ShotDrop-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
